<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cocos Creator | nxbxa</title>
<meta name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="renderer" content="webkit"/>
<meta name="force-rendering" content="webkit"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
<meta name="msapplication-tap-highlight" content="no">
<meta name="full-screen" content="yes"/>
<meta name="x5-fullscreen" content="true"/>
<meta name="360-fullscreen" content="true"/>
<meta name="screen-orientation" content="portrait"/>
<meta name="x5-orientation" content="portrait">
<meta name="x5-page-mode" content="app">
<!-- 本页只放我们自己的代码；游戏本体（引擎/启动脚本/素材/关卡包）全部从官方 CDN 取，hook.js 就地打补丁 -->
<base href="https://cgame.hulumao.top/nxbxa/web/">
<link rel="stylesheet" type="text/css" href="style-mobile.25fc5.css"/>
<link rel="icon" href="favicon.8de18.ico"/>
<script>
(function () {
  // 本站目录（…/repo/ 或 …/repo 无文件名都算目录；xx.html 才算文件）
  var p = location.pathname;
  if (/\/[^\/]*\.[a-z0-9]+$/i.test(p)) p = p.replace(/[^\/]*$/, '');
  else if (p.charAt(p.length - 1) !== '/') p += '/';
  var dir = location.origin + p;

  function loadScript(src, cb) {
    var s = document.createElement('script');
    s.src = src;
    if (cb) s.onload = cb;
    s.onerror = function () { console.warn('[nxbxa] 脚本加载失败: ' + src); };
    document.head.appendChild(s);
  }

  // 先装补丁壳，再拉官方启动脚本（会被 hook 改写），最后挂自动玩
  loadScript(dir + 'hook.js', function () {
    loadScript('src/settings.7557d.js', function () {
      loadScript('main.efc63.js', function () {
        var splash = document.getElementById('splash');
        if (splash) splash.style.display = 'block';
        var debug = window._CCSettings && window._CCSettings.debug;
        loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.69cce.js', function () {
          if (window.CC_PHYSICS_BUILTIN || window.CC_PHYSICS_CANNON) {
            loadScript('physics.js', window.boot);
          } else {
            window.boot();
          }
          loadScript(dir + 'autoplay-nxbxa.js');
        });
      });
    });
  });
})();
</script>
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>
</body>
</html>
